{% extends 'app/base.html' %}
{% load static %}

{% block category %}
<div class="row" style="width:100%">
  {% for product in products %}
  <div class="col-lg-3">
    <a href="{% url 'detail' %}?id={{product.id}}">
      <img class="thumbnail" src="{{product.image.url}}" style="cursor:pointer;">
    </a>
    <div class="box-element product">
      <h6><strong>{{ product.name }}</strong></h6>
      <h3 style="display: inline-block; float: right">
        <strong>${{ product.price|floatformat:2 }}</strong>
      </h3>
      <hr>
      <hr>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock category %}
